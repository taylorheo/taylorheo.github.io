name: Blog sync
# velog 글과 blog/_posts/*.md 생성물을 전용 브랜치의 PR로 올립니다.
on:
  schedule:
    - cron: '17 0 * * *'        # 매일 09:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blog/_posts/**'
      - 'blog/index.html'
      - 'blog/blog.css'
      - 'blog/blog.js'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blog-sync.yml'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: blog-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build blog (velog sync + markdown render)
        run: npm run blog:build
      - run: npm test
      - name: Create or update generated blog pull request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          base: main
          branch: automation/blog-sync
          add-paths: |
            blog/data/
            blog/*/index.html
            blog/feed.xml
            blog/sitemap.xml
          commit-message: 'blog: sync velog posts and rebuild pages'
          title: 'blog: sync velog posts and rebuild pages'
          body: |
            Velog 동기화 및 Markdown 렌더링으로 갱신한 블로그 생성물입니다.
            이 PR은 다음 동기화에서도 같은 브랜치로 갱신됩니다.
            변경 내용을 검토하고 필수 검사를 통과한 뒤 병합해 주세요.
            Actions 검사 승인 배너가 표시되면 Approve workflows to run을 선택해 주세요.
